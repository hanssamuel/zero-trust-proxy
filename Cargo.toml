[package]
name = "zero-trust-proxy"
version = "0.1.0"
edition = "2021"
authors = ["Osayemwenre Sam Jegbefumwen"]
description = "A Zero-Trust Authentication Proxy for modern security architectures"
license = "MIT"
repository = "https://github.com/yourusername/zero-trust-proxy"
keywords = ["security", "zero-trust", "proxy", "authentication", "authorization"]

[dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid"] }
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"

# HTTP & Proxy
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["full"] }

# TLS/Security
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2.1"
webpki-roots = "0.26"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database
redis = { version = "0.26", features = ["tokio-comp", "connection-manager"] }

# Authentication & Crypto
jsonwebtoken = "9.3"
argon2 = "0.5"
uuid = { version = "1.10", features = ["v4", "serde"] }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"

# OTP/MFA
totp-rs = "5.6"

# Logging & Metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Configuration
config = "0.14"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# IP & Geo
ipnetwork = "0.20"
maxminddb = "0.27"

# Policy Engine (OPA)
regorus = "0.2"

[dev-dependencies]
criterion = "0.5"
mockito = "1.5"
tempfile = "3.12"

[[bin]]
name = "zero-trust-proxy"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
