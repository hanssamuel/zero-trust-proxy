[server]
host = "0.0.0.0"
port = 8443
enable_tls = false
# tls_cert = "certs/server.crt"
# tls_key = "certs/server.key"

[database]
url = "postgresql://ztp_user:changeme@localhost:5432/zero_trust_proxy"
max_connections = 20

[redis]
url = "redis://localhost:6379"

[auth]
session_duration_minutes = 15
require_mfa = false
allowed_mfa_methods = ["totp", "webauthn"]
jwt_secret = "change-this-to-a-secure-random-string-in-production"
jwt_expiration_hours = 24

[webauthn]
# Relying-party identity for passkey ceremonies. Dev defaults use localhost
# (browsers treat http://localhost as a secure context). Production MUST set
# rp_id to the public domain and rp_origin to the public https:// origin.
# Each value can also be overridden with WEBAUTHN_RP_ID / WEBAUTHN_RP_ORIGIN /
# WEBAUTHN_RP_NAME / WEBAUTHN_ENABLED environment variables.
rp_id = "localhost"
rp_origin = "http://localhost:8443"
rp_name = "Zero-Trust Proxy"
enabled = true
# Credential store backend: "postgres" (default, durable) or "memory"
# (process-local, dev/tests only). Overridable via WEBAUTHN_PASSKEY_STORE.
passkey_store = "postgres"

[risk]
max_risk_score = 100
step_up_threshold = 60
block_threshold = 85
enable_geolocation = false
enable_threat_intel = false

[policy]
policy_file = "config/policy.rego"
enable_opa = false
default_deny = true

[upstream]
default_backend = "http://localhost:8080"
timeout_seconds = 30
enable_mtls = false
